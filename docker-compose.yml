version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: auditflow-mysql
    restart: always
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: auditflow
    volumes:
      - mysql_data:/var/lib/mysql

  minio:
    image: minio/minio:latest
    container_name: auditflow-minio
    restart: always
    ports:
      - "9100:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: admin123456
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: auditflow-api
    restart: always
    ports:
      - "3000:3000"
    depends_on:
      - db
      - minio
    environment:
      - NODE_ENV=production
      # La expresión regular escapa los $ duplicándolos ($$) para Docker Compose
      - CORS_ORIGIN=http://localhost,http://localhost:5173,capacitor://localhost,^https?://192\.168\.\d{1,3}\.\d{1,3}(:\d+)?$$
      - DB_HOST=db
      - DB_PORT=3306
      - DB_USER=root
      - DB_PASS=root
      - DB_NAME=auditflow
      - DB_SYNC=true
      - MINIO_ENDPOINT=minio
      - MINIO_PORT=9000
      - MINIO_ACCESS_KEY=admin
      - MINIO_SECRET_KEY=admin123456
      - STORAGE_PATH=/usr/src/app/storage
    volumes:
      - ./storage_data:/usr/src/app/storage

volumes:
  mysql_data:
  minio_data: